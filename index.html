<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E0E0E">
<title>BowlBoard</title>
<meta name="description" content="BowlBoard — Built for Bowlers. Every game. Every session. Your bowling history.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BowlBoard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand"><img class="app-wordmark" src="wordmark.png" alt="BowlBoard"></div>
    <button class="hdr-gear" id="hdrGear" type="button" aria-label="Settings and more"></button>
  </header>

  <main class="screens">
    <section id="screen-home" class="screen"></section>
    <section id="screen-new" class="screen"></section>
    <section id="screen-entry" class="screen"></section>
    <section id="screen-photo" class="screen"></section>
    <section id="screen-saved" class="screen"></section>
    <section id="screen-game" class="screen"></section>
    <section id="screen-session" class="screen"></section>
    <section id="screen-ball" class="screen"></section>
    <section id="screen-history" class="screen"></section>
    <section id="screen-stats" class="screen"></section>
    <section id="screen-achievements" class="screen"></section>
    <section id="screen-league" class="screen"></section>
    <section id="screen-matchup" class="screen"></section>
    <section id="screen-more" class="screen"></section>
    <section id="screen-centers" class="screen"></section>
    <section id="screen-balls" class="screen"></section>
    <section id="screen-backup" class="screen"></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button data-nav="home" class="active"><span>Home</span></button>
    <button data-nav="history"><span>History</span></button>
    <button data-nav="stats"><span>Stats</span></button>
    <button data-nav="league"><span>League</span></button>
    <button data-nav="more"><span>More</span></button>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- artwork the share cards draw from (never shown; inlined into the single-file builds) -->
<div hidden aria-hidden="true"><img id="scLogo" src="share-logo.png" alt=""></div>
<div id="sheet" class="sheet-wrap" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>

<script src="js/score.js"></script>
<script src="js/data.js"></script>
<script src="js/ball-list.js"></script>
<script src="js/store.js"></script>
<script src="js/config.js"></script>
<script src="js/account.js"></script>
<script src="js/league.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/games-import.js"></script>
<script src="js/scan.js"></script>
<script src="js/glyph-model.js"></script>
<script src="js/glyphs.js"></script>
<script src="js/insights.js"></script>
<script src="js/achievements.js"></script>
<script src="js/xlsx-write.js"></script>
<script src="js/pdf-write.js"></script>
<script src="js/export.js"></script>
<script src="js/sample.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui/core.js"></script>
<script src="js/ui/shared.js"></script>
<script src="js/ui/ball-add.js"></script>
<script src="js/ui/home.js"></script>
<script src="js/ui/setup.js"></script>
<script src="js/ui/entry.js"></script>
<script src="js/ui/editor.js"></script>
<script src="js/ui/photo.js"></script>
<script src="js/ui/games.js"></script>
<script src="js/ui/stats.js"></script>
<script src="js/ui/more.js"></script>
<script src="js/ui/import-scores.js"></script>
<script src="js/ui/export.js"></script>
<script src="js/ui/achievements.js"></script>
<script src="js/ui/share.js"></script>
<script src="js/ui/league-shell.js"></script>
<script src="js/ui/league-standings.js"></script>
<script src="js/ui/league-scores.js"></script>
<script src="js/ui/league-import.js"></script>
<script src="js/ui/boot.js"></script>
</body>
</html>
