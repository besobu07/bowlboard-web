name: Generate Paper icons (staging only)
on:
  push:
    branches: [branding/paper-icons]
    paths: [tools/generate-icons.py, .github/workflows/paper-icons.yml]
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/branding/paper-icons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install CairoSVG==2.8.2 Pillow==11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python tools/generate-icons.py
      - run: npm run stamp
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Commit verified assets to staging branch
        run: |
          test "$(git branch --show-current)" = "branding/paper-icons"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-icon.svg app-icon.png apple-touch-icon.png favicon.png icon-192.png icon-512.png icon-maskable-512.png share-logo.png wordmark.png sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Generate Paper icons and stamp verified app cache"
          git push origin HEAD:refs/heads/branding/paper-icons
